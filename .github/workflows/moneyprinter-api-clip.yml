name: MoneyPrinter API Clip

on:
  push:
    paths:
      - 'mpt-api-requests/*.json'

permissions:
  contents: read

concurrency:
  group: moneyprinter-api-single
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Create MoneyPrinter task via REST API
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_SOURCE=$(ls -1t mpt-api-requests/*.json | head -1)
          cp "$REQUEST_SOURCE" envelope.json
          python - <<'PY'
          import json
          env=json.load(open('envelope.json',encoding='utf-8'))
          base=env.pop('base_url').rstrip('/')
          open('base_url.txt','w',encoding='utf-8').write(base)
          json.dump(env,open('request.json','w',encoding='utf-8'),ensure_ascii=False)
          print('BASE_URL='+base)
          PY
          BASE_URL=$(cat base_url.txt)
          curl --fail-with-body --retry 3 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -H 'ngrok-skip-browser-warning: 1' \
            --data-binary @request.json \
            "$BASE_URL/api/v1/videos" > create-response.json
          cat create-response.json
          python - <<'PY'
          import json
          d=json.load(open('create-response.json',encoding='utf-8'))
          task=((d.get('data') or {}).get('task_id') or d.get('task_id'))
          if not task:
              raise SystemExit(f'No task_id: {d}')
          open('task_id.txt','w').write(task)
          print('TASK_ID='+task)
          PY

      - name: Poll task and download video
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL=$(cat base_url.txt)
          TASK_ID=$(cat task_id.txt)
          rm -f video_url.txt
          for i in $(seq 1 180); do
            curl --fail-with-body --retry 2 --retry-all-errors \
              -H 'ngrok-skip-browser-warning: 1' \
              "$BASE_URL/api/v1/tasks/$TASK_ID" > task.json || true
            python - <<'PY' && code=0 || code=$?
          import json,sys
          try:
              d=json.load(open('task.json',encoding='utf-8'))
          except Exception as e:
              print('BAD_JSON',e); sys.exit(10)
          data=d.get('data') or d
          print('STATE',data.get('state'),'PROGRESS',data.get('progress'))
          if data.get('error'):
              print('TASK_ERROR',data.get('error')); sys.exit(20)
          state=data.get('state')
          vids=data.get('combined_videos') or data.get('videos') or []
          if not vids:
              if state == -1: sys.exit(20)
              sys.exit(10)
          url=vids[0]
          base=open('base_url.txt').read().strip()
          if url.startswith('/'):
              url=base+url
          elif not url.startswith('http'):
              url=base+'/'+url.lstrip('/')
          open('video_url.txt','w').write(url)
          print('VIDEO_URL='+url)
          PY
            if [ "$code" -eq 0 ]; then break; fi
            if [ "$code" -eq 20 ]; then cat task.json; exit 20; fi
            sleep 10
          done
          test -s video_url.txt
          VIDEO_URL=$(cat video_url.txt)
          curl --fail-with-body --retry 3 --retry-all-errors -L \
            -H 'ngrok-skip-browser-warning: 1' \
            "$VIDEO_URL" -o mpt-visual.mp4
          test -s mpt-visual.mp4

      - name: Probe video
        run: |
          ffprobe -v error -show_entries stream=width,height -show_entries format=duration,size -of json mpt-visual.mp4 > ffprobe.json
          cat ffprobe.json

      - uses: actions/upload-artifact@v4
        with:
          name: moneyprinter-api-visual-${{ github.run_id }}
          path: |
            mpt-visual.mp4
            ffprobe.json
            task.json
            request.json
            create-response.json
          retention-days: 7
          if-no-files-found: error
