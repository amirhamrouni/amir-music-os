name: MoneyPrinter Clip

on:
  push:
    paths:
      - 'mpt-requests/*.json'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Drive MoneyPrinter WebUI
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_SOURCE=$(ls -1t mpt-requests/*.json | head -1)
          cp "$REQUEST_SOURCE" envelope.json
          cat > run_mpt.py <<'PY'
          import json, re, time
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          req=json.load(open('envelope.json',encoding='utf-8'))
          base=req['base_url'].rstrip('/')
          subject=req['video_subject']
          script=req.get('video_script','')
          terms=req.get('video_terms','')

          def fill_area(page, label, value):
              if not value:
                  return
              box=page.locator("div[data-testid='stTextArea']").filter(has_text=label).locator('textarea')
              if box.count():
                  box.first.fill(value)
                  return
              alt=page.get_by_label(label, exact=True)
              if alt.count():
                  alt.first.fill(value)
                  return
              raise RuntimeError(f'Cannot find textarea: {label}')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context(
                  accept_downloads=True,
                  viewport={"width":1440,"height":1200},
                  extra_http_headers={"ngrok-skip-browser-warning":"1"},
              )
              page=ctx.new_page()
              try:
                  page.goto(base, wait_until='domcontentloaded', timeout=120000)
                  page.get_by_text('MoneyPrinterTurbo', exact=False).first.wait_for(timeout=120000)
                  fill_area(page, 'Video Subject', subject)
                  fill_area(page, 'Video Script (Optional)', script)
                  fill_area(page, 'Video Keywords (English, Optional)', terms)
                  page.screenshot(path='mpt-ready.png', full_page=True)

                  btn=page.get_by_role('button', name='Generate Video', exact=True)
                  if not btn.count():
                      btn=page.get_by_role('button', name='Start Generating Video', exact=True)
                  btn.first.scroll_into_view_if_needed()
                  btn.first.click(timeout=60000)

                  deadline=time.time()+2100
                  completed=False
                  while time.time()<deadline:
                      if page.get_by_text('Video Generation Failed', exact=False).count():
                          page.screenshot(path='mpt-failed.png', full_page=True)
                          raise RuntimeError('MoneyPrinter reported generation failure')
                      if page.get_by_text('Video Generation Completed', exact=False).count():
                          completed=True
                          break
                      if page.get_by_role('button', name=re.compile('Download Video', re.I)).count():
                          completed=True
                          break
                      time.sleep(5)
                  if not completed:
                      page.screenshot(path='mpt-timeout.png', full_page=True)
                      raise TimeoutError('Timed out waiting for MoneyPrinter output')

                  dls=page.get_by_role('button', name=re.compile('Download Video', re.I))
                  if not dls.count():
                      page.get_by_text('Video Generation Completed', exact=False).first.scroll_into_view_if_needed()
                      time.sleep(2)
                      dls=page.get_by_role('button', name=re.compile('Download Video', re.I))
                  if not dls.count():
                      page.screenshot(path='mpt-no-download.png', full_page=True)
                      raise RuntimeError('Generation completed but no Download Video button was found')

                  with page.expect_download(timeout=120000) as di:
                      dls.last.click()
                  download=di.value
                  download.save_as('mpt-visual.mp4')
                  page.screenshot(path='mpt-complete.png', full_page=True)
                  print('MPT_UI_OK', download.suggested_filename)
              finally:
                  browser.close()
          PY
          python run_mpt.py
          test -s mpt-visual.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneyprinter-visual
          path: |
            mpt-visual.mp4
            mpt-ready.png
            mpt-complete.png
            mpt-failed.png
            mpt-timeout.png
            mpt-no-download.png
            envelope.json
          if-no-files-found: warn
          retention-days: 7
