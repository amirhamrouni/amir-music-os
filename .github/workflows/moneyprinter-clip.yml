name: MoneyPrinter Clip

on:
  push:
    paths:
      - 'mpt-requests/*.json'

permissions:
  contents: read

concurrency:
  group: moneyprinter-webui-single
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Drive MoneyPrinter WebUI
        shell: bash
        run: |
          set -euo pipefail
          REQUEST_SOURCE=$(ls -1t mpt-requests/*.json | head -1)
          cp "$REQUEST_SOURCE" envelope.json
          cat > run_mpt.py <<'PY'
          import json, re, time
          from playwright.sync_api import sync_playwright

          req=json.load(open('envelope.json',encoding='utf-8'))
          base=req['base_url'].rstrip('/')
          subject=req['video_subject']
          script=req.get('video_script','')
          terms=req.get('video_terms','')
          if isinstance(terms,list):
              terms=', '.join(terms)

          def fill_area(page, label, value, fallback_index):
              if not value:
                  return
              candidates=[
                  page.locator(f"textarea[aria-label='{label}']"),
                  page.locator("div[data-testid='stTextArea']").filter(has_text=label).locator('textarea'),
                  page.get_by_label(label, exact=True),
              ]
              for box in candidates:
                  if box.count():
                      box.first.fill(value)
                      print('FILLED', label)
                      return
              areas=page.locator('textarea')
              if areas.count()>fallback_index:
                  areas.nth(fallback_index).fill(value)
                  print('FILLED_FALLBACK', label, fallback_index)
                  return
              raise RuntimeError(f'Cannot find field: {label}; textareas={areas.count()}')

          def clear_tour(page):
              page.evaluate("document.querySelectorAll('.driver-overlay,.driver-popover,.driver-active-element').forEach(e=>{if(e.classList.contains('driver-active-element')){e.classList.remove('driver-active-element')}else{e.remove()}})")

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              ctx=browser.new_context(
                  accept_downloads=True,
                  viewport={"width":1440,"height":1600},
                  extra_http_headers={"ngrok-skip-browser-warning":"1"},
              )
              page=ctx.new_page()
              try:
                  page.goto(base, wait_until='domcontentloaded', timeout=120000)
                  page.get_by_text('MoneyPrinterTurbo', exact=False).first.wait_for(timeout=120000)
                  page.locator('textarea').first.wait_for(state='visible', timeout=90000)
                  print('MPT_READY')
                  fill_area(page, 'Video Subject', subject, 0)
                  fill_area(page, 'Video Script (Optional)', script, 1)
                  fill_area(page, 'Video Keywords (English, Optional)', terms, 2)
                  clear_tour(page)
                  page.screenshot(path='mpt-ready.png', full_page=True)

                  btn=page.get_by_role('button', name='Generate Video', exact=True)
                  if not btn.count():
                      btn=page.locator('button').filter(has_text=re.compile(r'Generate Video|Start Generating Video', re.I))
                  if not btn.count():
                      raise RuntimeError('Generate Video button not found')
                  btn.first.scroll_into_view_if_needed()
                  btn.first.click(timeout=30000, force=True)
                  print('GENERATE_CLICKED')
                  page.wait_for_timeout(3000)

                  deadline=time.time()+2100
                  last_status=''
                  while time.time()<deadline:
                      clear_tour(page)
                      body=page.locator('body').inner_text()
                      if 'Video Generation Failed' in body:
                          page.screenshot(path='mpt-failed.png', full_page=True)
                          print(body[-8000:])
                          raise RuntimeError('MoneyPrinter reported generation failure')
                      dls=page.get_by_role('button', name=re.compile('Download Video', re.I))
                      if dls.count():
                          print('DOWNLOAD_READY', dls.count())
                          break
                      status='GENERATING' if ('Generating Video' in body or 'Start Generating Video' in body) else 'WAITING'
                      if status != last_status:
                          print('STATUS',status)
                          last_status=status
                      time.sleep(5)
                  else:
                      page.screenshot(path='mpt-timeout.png', full_page=True)
                      print(page.locator('body').inner_text()[-10000:])
                      raise TimeoutError('Timed out waiting for MoneyPrinter output')

                  dls=page.get_by_role('button', name=re.compile('Download Video', re.I))
                  clear_tour(page)
                  with page.expect_download(timeout=120000) as di:
                      dls.last.click(force=True)
                  download=di.value
                  download.save_as('mpt-visual.mp4')
                  page.screenshot(path='mpt-complete.png', full_page=True)
                  print('MPT_UI_OK', download.suggested_filename)
              finally:
                  browser.close()
          PY
          python run_mpt.py
          test -s mpt-visual.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneyprinter-visual-${{ github.run_id }}
          path: |
            mpt-visual.mp4
            mpt-ready.png
            mpt-complete.png
            mpt-failed.png
            mpt-timeout.png
            envelope.json
          if-no-files-found: warn
          retention-days: 7
