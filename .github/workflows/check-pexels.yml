name: Check Pexels Secret

on:
  push:
    paths:
      - '.mpt-check/**'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PEXELS_API_KEYS: ${{ secrets.PEXELS_API_KEYS }}
    steps:
      - name: Check configured Pexels secret
        shell: bash
        run: |
          if [ -n "${PEXELS_API_KEY:-}" ]; then
            echo 'PEXELS_API_KEY_PRESENT=true'
          elif [ -n "${PEXELS_API_KEYS:-}" ]; then
            echo 'PEXELS_API_KEYS_PRESENT=true'
          else
            echo 'PEXELS_SECRET_PRESENT=false'
            exit 21
          fi
